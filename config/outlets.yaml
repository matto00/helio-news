# helio-news feed + interest configuration.
#
# Two parts:
#   feeds      — RSS/Atom sources grouped by topic. `weight` biases the triage
#                pass toward topics you care about; `grounding: true` marks the
#                broad wire services used to balance the personal-bias feeds.
#   watchlist  — entities the triage/planner boost wherever they appear across
#                ALL feeds, plus the ticker map that drives the stock enricher.
#                `ticker: private` = tracked, but headlines-only (no chart).
#
# NOTE: feed URLs drift; `python -m news.fetch --check` validates them and
# reports any that 404 or return no entries. Fix those before the first real run.

defaults:
  # How far back a run considers an article "new" (hours).
  lookback_hours: 30
  # Max stories the day's dashboard is built around.
  top_stories: 8
  # Articles handed to the (small) triage model after heuristic pre-ranking.
  triage_candidates: 80

# Local inference. Passes run SEQUENTIALLY (one 9.6 GB model resident at a time
# is all a 16 GB GPU wants) — change any single line to route a pass to a
# beefier local model (e.g. planner: "qwen3.5:27b") without touching code.
ollama:
  host: "http://localhost:11434"
  timeout_seconds: 180
models:
  triage: "gemma4:e4b"
  planner: "gemma4:e4b"
  summarizer: "gemma4:e4b"

# The helio MCP server this project drives (Python spawns it over stdio; the PAT
# lives in the server's own env, never here). Override via env HELIO_MCP_CMD /
# HELIO_PAT / HELIO_API_BASE_URL if your paths differ.
helio:
  mcp_command: "node"
  mcp_args: ["/home/matt/Development/helio/helio-mcp/dist/index.js"]
  dashboard_name: "News Overview"

feeds:
  grounding:            # broad, low-bias wire services
    weight: 1.0
    grounding: true
    sources:
      # AP and Reuters dropped their public RSS; Guardian/NPR/Al Jazeera/BBC
      # give equivalent broad-wire grounding.
      - { name: "NPR News",       url: "https://feeds.npr.org/1001/rss.xml" }
      - { name: "Guardian World", url: "https://www.theguardian.com/world/rss" }
      - { name: "Al Jazeera",     url: "https://www.aljazeera.com/xml/rss/all.xml" }
      - { name: "BBC World",      url: "https://feeds.bbci.co.uk/news/world/rss.xml" }

  politics:             # U.S. politics
    weight: 1.4
    sources:
      - { name: "Guardian US Politics", url: "https://www.theguardian.com/us-news/us-politics/rss" }
      - { name: "Politico",      url: "https://rss.politico.com/politics-news.xml" }
      - { name: "The Hill",      url: "https://thehill.com/homenews/feed/" }
      - { name: "NPR Politics",  url: "https://feeds.npr.org/1014/rss.xml" }

  sports:               # basketball / soccer / football / baseball
    weight: 1.3
    sources:
      - { name: "ESPN Top",   url: "https://www.espn.com/espn/rss/news" }
      - { name: "ESPN NBA",   url: "https://www.espn.com/espn/rss/nba/news" }
      - { name: "ESPN NFL",   url: "https://www.espn.com/espn/rss/nfl/news" }
      - { name: "ESPN MLB",   url: "https://www.espn.com/espn/rss/mlb/news" }
      - { name: "ESPN Soccer", url: "https://www.espn.com/espn/rss/soccer/news" }

  tech:                 # FAANG + general tech
    weight: 1.3
    sources:
      - { name: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index" }
      - { name: "The Verge",    url: "https://www.theverge.com/rss/index.xml" }
      - { name: "TechCrunch",   url: "https://techcrunch.com/feed/" }

  ai:                   # AI-specific (Anthropic / OpenAI et al.)
    weight: 1.5
    sources:
      # Anthropic publishes no RSS; its news surfaces via watchlist keyword
      # matching across these AI/tech feeds instead.
      - { name: "OpenAI News",     url: "https://openai.com/news/rss.xml" }
      - { name: "Simon Willison",  url: "https://simonwillison.net/atom/everything/" }
      - { name: "Import AI",       url: "https://importai.substack.com/feed" }

  markets:              # markets / business (pulled in "as needed")
    weight: 1.1
    sources:
      - { name: "CNBC Top",     url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114" }
      - { name: "MarketWatch",  url: "http://feeds.marketwatch.com/marketwatch/topstories/" }

# Entities boosted wherever they appear, regardless of which feed they came from.
# `tickers` drives the stock enricher; teams drive the (future) sports enricher.
watchlist:
  companies:
    - { name: "Apple",     keywords: ["apple", "aapl"],            ticker: "AAPL" }
    - { name: "Amazon",    keywords: ["amazon", "amzn", "aws"],    ticker: "AMZN" }
    - { name: "Meta",      keywords: ["meta", "facebook", "instagram"], ticker: "META" }
    - { name: "Alphabet",  keywords: ["google", "alphabet", "deepmind"], ticker: "GOOGL" }
    - { name: "Netflix",   keywords: ["netflix", "nflx"],          ticker: "NFLX" }
    - { name: "Nvidia",    keywords: ["nvidia", "nvda"],           ticker: "NVDA" }
    - { name: "C3.ai",     keywords: ["c3.ai", "c3 ai"],           ticker: "AI" }
    - { name: "Anthropic", keywords: ["anthropic", "claude"],      ticker: "private" }
    - { name: "OpenAI",    keywords: ["openai", "chatgpt", "gpt-"], ticker: "private" }

  people:
    - { name: "Boris Cherny",    keywords: ["boris cherny", "claude code"] }
    - { name: "Andrej Karpathy", keywords: ["karpathy"] }

  teams:                # San Francisco + San Diego lean
    - { name: "SF Giants",     league: "MLB", keywords: ["giants", "sf giants"] }
    - { name: "SD Padres",     league: "MLB", keywords: ["padres"] }
    - { name: "SF 49ers",      league: "NFL", keywords: ["49ers", "niners"] }
    - { name: "Golden State Warriors", league: "NBA", keywords: ["warriors", "dubs"] }
