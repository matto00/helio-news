# systemd drop-in for the packaged ollama.service.
# Install to: /etc/systemd/system/ollama.service.d/10-user-models.conf
#
# Why: the Arch package runs ollama as User=ollama with
# OLLAMA_MODELS=/var/lib/ollama — which is EMPTY here. The real models (~74 GB:
# gemma4:e4b, qwen3.5, …) live in /home/matt/.ollama/models, because ollama has
# been started by hand as `matt`. The packaged unit also sets ProtectHome=yes,
# which makes /home unreadable to the service, so simply repointing
# OLLAMA_MODELS is not enough — ProtectHome must be relaxed too.
#
# Sorts BEFORE the existing override.conf, so that file's
# OLLAMA_CONTEXT_LENGTH=8192 still applies (drop-ins merge alphabetically).
#
# After installing:  sudo systemctl daemon-reload && sudo systemctl enable --now ollama
# Stop starting `ollama serve` by hand afterwards — it would fight for :11434.
[Service]
User=matt
Group=matt
WorkingDirectory=/home/matt
Environment="HOME=/home/matt"
Environment="OLLAMA_MODELS=/home/matt/.ollama/models"
ProtectHome=no
